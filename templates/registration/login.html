{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | SistemaCamaras</title>
  <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-xl p-10 w-full max-w-sm">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="/media/logotipo.png" alt="Logo" class="h-20 object-contain">
    </div>

    <h1 class="text-xl font-bold text-gray-800 text-center mb-1">SistemaCamaras</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Ingresa tus credenciales para continuar</p>

    <!-- Errores -->
    {% if form.errors %}
    <div class="bg-red-100 text-red-700 border border-red-300 rounded p-3 mb-4 text-sm">
      Usuario o contraseña incorrectos.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-4">
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text"
               name="username"
               id="id_username"
               autofocus
               autocomplete="username"
               class="border border-gray-300 rounded w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-6">
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password"
               name="password"
               id="id_password"
               autocomplete="current-password"
               class="border border-gray-300 rounded w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium transition">
        Iniciar sesión
      </button>
    </form>

  </div>

</body>
</html>
