{% extends "base.html" %}

{% block title %}Editar — {{ camara.nombre }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 shadow rounded-lg">
  <h2 class="text-xl font-bold text-gray-800 mb-6">Editar Cámara: {{ camara.nombre }}</h2>

  <form method="post" action="{% url 'editar_camara' camara.pk %}">
    {% csrf_token %}

    {% for field in form %}
    <div class="mb-4">
      <label for="{{ field.id_for_label }}"
             class="block text-sm font-medium text-gray-700 mb-1">
        {{ field.label }}
      </label>
      <input type="{{ field.field.widget.input_type }}"
             name="{{ field.html_name }}"
             id="{{ field.id_for_label }}"
             value="{{ field.value|default:'' }}"
             class="border border-gray-300 rounded w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500
             {% if field.errors %}border-red-400{% endif %}">
      {% for error in field.errors %}
      <p class="text-red-600 text-sm mt-1">{{ error }}</p>
      {% endfor %}
    </div>
    {% endfor %}

    <div class="flex items-center gap-4 mt-6">
      <button type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        Actualizar
      </button>
      <a href="{% url 'lista_camaras' %}" class="text-gray-500 hover:underline text-sm">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
